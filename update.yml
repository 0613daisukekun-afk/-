name: Daily Drone Incident Scraper

on:
  # 毎日 JST 09:00 (UTC 00:00) に自動実行
  schedule:
    - cron: "0 0 * * *"
  # 手動実行ボタン（デバッグ・初回テスト用）
  workflow_dispatch:

permissions:
  contents: write   # data.json をコミットするために必要

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. リポジトリのチェックアウト ──────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python セットアップ ─────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ── 3. 依存ライブラリのインストール ────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. スクレイパー実行 ────────────────────────────────────────────────
      - name: Run scraper
        run: python scraper.py

      # ── 5. data.json に差分があればコミット & プッシュ ──────────────────────
      - name: Commit and push if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          # 差分がない場合はスキップ（終了コード 0 を維持）
          git diff --cached --quiet || git commit -m "chore: update drone incident data [$(date -u +'%Y-%m-%d')]"
          git push
